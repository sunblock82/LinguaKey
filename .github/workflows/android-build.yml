name: Build LinguaKey APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.13
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build and run unit tests
        run: gradle :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest :app:assembleRelease --stacktrace

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Android 35 runtime smoke tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          target: default
          disable-animations: true
          script: gradle :app:connectedDebugAndroidTest --stacktrace

      - name: Name installation file
        run: |
          cp app/build/outputs/apk/release/app-release-unsigned.apk LinguaKey-unsigned.apk
          cp "$ANDROID_HOME/build-tools/36.0.0/lib/apksigner.jar" apksigner.jar
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging LinguaKey-unsigned.apk > apk-badging.txt
          if grep -q "application-debuggable" apk-badging.txt; then exit 1; fi

      - name: Upload validation reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: LinguaKey-test-reports
          path: |
            app/build/reports/tests/
            app/build/reports/androidTests/
            app/build/outputs/androidTest-results/
            apk-badging.txt

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: LinguaKey-apk
          path: |
            LinguaKey-unsigned.apk
            apksigner.jar
          if-no-files-found: error
